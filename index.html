<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfbf7;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            background-color: #c5a880;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b0936b;
        }
    </style>
</head>
<body>

    <h1>Notre Mariage</h1>
    <p>Merci de confirmer ta présence en remplissant le formulaire ci-dessous :</p>

    <form action="https://formspree.io/f/xjywgoyp" method="POST">
        <input type="text" name="nom" placeholder="Nom et Prénom" required />
        <input type="text" name="allergies" placeholder="Allergies ou régime spécial" />
        <textarea name="message" placeholder="Un petit mot pour les mariés" rows="4"></textarea>
        <button type="submit">Envoyer</button>
    </form>

</body>
</html>
